<div class="container admin-dashboard">
  <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h1>Admin Dashboard</h1>
    <button class="btn btn-outline-danger" (click)="logout()">Logout</button>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card admin-card" [routerLink]="['/admin/players']">
        <div class="card-body text-center">
          <h3>Players</h3>
          <p>Add, edit, or remove players</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card admin-card" [routerLink]="['/admin/matches']">
        <div class="card-body text-center">
          <h3>Matches</h3>
          <p>Record match results and stats</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card admin-card" [routerLink]="['/admin/seasons']">
        <div class="card-body text-center">
          <h3>Seasons</h3>
          <p>Manage seasons</p>
        </div>
      </div>
    </div>
  </div>
</div>
