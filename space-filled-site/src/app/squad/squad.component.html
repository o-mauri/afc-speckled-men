<div class="container">
  <div *ngIf="loading" class="text-center mt-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="!loading" class="card card-main">
    <div class="card-header card-header-main">
      AFC Speckled Men Squad
      <button class="incFriendlies" (click)="toggleFriendlies()">
        Include Friendlies: {{ incFriendlies ? 'On' : 'Off' }}
      </button>
    </div>
    <div class="card-body-stats">
      <div *ngIf="playerStats.length === 0" class="text-muted p-3">No match data yet.</div>
      <div *ngFor="let player of playerStats" class="card pl-main">
        <div class="card-header pl-header">
          <img
            *ngIf="player.imageUrl"
            [src]="player.imageUrl"
            class="player-avatar"
            alt="{{ player.playerName }}"
          />
          <div *ngIf="!player.imageUrl" class="player-avatar-placeholder">
            {{ player.playerName.charAt(0) }}
          </div>
          {{ player.playerName }}
        </div>
        <div class="card-body pl-body">
          <div class="statsbox">
            <div class="statsline">
              <fa-icon class="fa-fw" [icon]="userIcon" [fixedWidth]="true"></fa-icon>
              {{ getMatches(player) }}
            </div>
            <div class="statsline">
              <fa-icon class="fa-fw" [icon]="footyIcon" [fixedWidth]="true"></fa-icon>
              {{ getGoals(player) }}
            </div>
            <div class="statsline">
              <fa-icon class="fa-fw" [icon]="aIcon" [fixedWidth]="true"></fa-icon>
              {{ getAssists(player) }}
            </div>
          </div>
          <div class="winbox">
            <div>Wins: <span class="outcome">{{ getWins(player) }}</span></div>
            <div>Win %: <span class="outcome">{{ getWinP(player) }}%</span></div>
            <div>GPG: <span class="outcome">{{ getGPG(player) }}</span></div>
            <div>APG: <span class="outcome">{{ getAPG(player) }}</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
